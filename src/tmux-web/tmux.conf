# Configuration of the companion's own tmux server (tmux -L code-web). Your ~/.tmux.conf is not read.
# Claude Code asks for focus events.
set -s focus-events on
set -g mouse on
set -g history-limit 50000
# Keep window names: automatic renaming uses the command name, which for Claude Code is its version number.
set -wg automatic-rename off
# Keep the last screen of a Claude that fails to start, so the page can show why.
set -wg remain-on-exit failed
# The viewer used last sets the window size, as tmux does for terminals. Keys sent through control mode do not
# count as use, so the page's panel claims the size itself (switch-client) when you type in it.
set -wg window-size latest
